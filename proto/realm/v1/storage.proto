syntax = "proto3";

package realm.v1;

option go_package = "github.com/irvanmalik48/realm-api/pkg/pb/realm/v1;realmv1";

message FileMetadata {
  string id = 1;
  string filename = 2;
  string content_type = 3;
  int64 original_size = 4;
  int64 compressed_size = 5;
  double savings_percent = 6;
  string sha256 = 7;
  optional string blurhash = 8;
  optional int32 width = 9;
  optional int32 height = 10;
  string url = 11;
  optional string webp_url = 12;
  string created_at = 13;
  string storage_backend = 14;
  optional string s3_bucket = 15;
  optional string s3_key = 16;
  optional string s3_etag = 17;
}

message UploadFileRequest {
  string filename = 1;
  string content_type = 2;
  bytes data = 3;
}

message UploadFileResponse {
  string status = 1;
  string message = 2;
  FileMetadata file = 3;
}

message GetFileInfoRequest {
  string id = 1;
}

message GetFileInfoResponse {
  string status = 1;
  FileMetadata file = 2;
}

message DeleteFileRequest {
  string id = 1;
}

message DeleteFileResponse {
  string status = 1;
  string message = 2;
}

message GetFileRequest {
  string id = 1;
  optional string format = 2;
}

message FileChunkResponse {
  bytes chunk = 1;
  string content_type = 2;
  string filename = 3;
}

message ListFilesRequest {
  int32 limit = 1;
  int32 offset = 2;
  optional string search = 3;
  optional string backend = 4;
}

message ListFilesResponse {
  int32 total = 1;
  repeated FileMetadata files = 2;
}

message StorageStatsRequest {}

message StorageStatsResponse {
  string active_backend = 1;
  int64 total_files = 2;
  int64 total_original_bytes = 3;
  int64 total_compressed_bytes = 4;
  double average_savings_percent = 5;
  optional string s3_bucket_name = 6;
}

message GeneratePresignedUrlRequest {
  string id = 1;
  int64 expiry_seconds = 2;
}

message GeneratePresignedUrlResponse {
  string presigned_url = 1;
  string expires_at = 2;
}

service StorageService {
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse);
  rpc GetFileInfo(GetFileInfoRequest) returns (GetFileInfoResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc GetFile(GetFileRequest) returns (stream FileChunkResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc GetStorageStats(StorageStatsRequest) returns (StorageStatsResponse);
  rpc GeneratePresignedUrl(GeneratePresignedUrlRequest) returns (GeneratePresignedUrlResponse);
}
