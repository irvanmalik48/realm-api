syntax = "proto3";

package realm.v1;

option go_package = "github.com/irvanmalik48/realm-api/pkg/pb/realm/v1;realmv1";

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string service = 2;
  string version = 3;
  int64 uptime_seconds = 4;
  string timestamp = 5;
  string database = 6;
}

message DBPoolStats {
  int32 acquired_conns = 1;
  int32 idle_conns = 2;
  int32 total_conns = 3;
  int32 max_conns = 4;
}

message RuntimeStats {
  int32 goroutines = 1;
  uint64 alloc_bytes = 2;
  uint64 total_alloc_bytes = 3;
  uint64 sys_bytes = 4;
  uint32 gc_cycles = 5;
}

message CPUStats {
  double usage_percent = 1;
  repeated double core_usage_percent = 2;
  double avg_frequency_mhz = 3;
  repeated double core_frequency_mhz = 4;
  double min_frequency_mhz = 5;
  double max_frequency_mhz = 6;
  double load_1m = 7;
  double load_5m = 8;
  double load_15m = 9;
  string model_name = 10;
  int32 core_count = 11;
}

message DetailedTelemetryResponse {
  string status = 1;
  string service = 2;
  string version = 3;
  int64 uptime_seconds = 4;
  string timestamp = 5;
  string database = 6;
  DBPoolStats db_pool = 7;
  RuntimeStats runtime = 8;
  CPUStats cpu = 9;
}

service HealthService {
  rpc GetHealth(HealthRequest) returns (HealthResponse);
  rpc GetDetailedTelemetry(HealthRequest) returns (DetailedTelemetryResponse);
  rpc StreamTelemetry(HealthRequest) returns (stream DetailedTelemetryResponse);
}
