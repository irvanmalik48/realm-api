syntax = "proto3";

package realm.v1;

option go_package = "github.com/irvanmalik48/realm-api/pkg/pb/realm/v1;realmv1";

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string service = 2;
  string version = 3;
  int64 uptime_seconds = 4;
  string timestamp = 5;
  string database = 6;
}

service HealthService {
  rpc GetHealth(HealthRequest) returns (HealthResponse);
}
