services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realm-api
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    environment:
      - PORT=8080
      - GRPC_PORT=50051
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://irvanma.eu.org}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@realm-postgres:5432/${POSTGRES_DB:-realm}?sslmode=disable
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - LASTFM_API_SECRET=${LASTFM_API_SECRET}
      - CACHE_REVALIDATE_SECONDS=${CACHE_REVALIDATE_SECONDS:-900}
      - STORAGE_DIR=/data/storage
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://realm-seaweedfs:8333}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-realm-assets}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-realm}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-realmsecret}
      - S3_USE_PATH_STYLE=${S3_USE_PATH_STYLE:-true}
      - S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN:-}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-10}
      - PASETO_SYMMETRIC_KEY=${PASETO_SYMMETRIC_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-https://irvanma.eu.org}
      - SUPERADMIN_EMAILS=${SUPERADMIN_EMAILS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URL=${GITHUB_REDIRECT_URL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - CONTACT_RECEIVER_EMAIL=${CONTACT_RECEIVER_EMAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - PYROSCOPE_SERVER_ADDRESS=${PYROSCOPE_SERVER_ADDRESS}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - ./data/storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caddy_net
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    env_file:
      - path: .env
        required: false

  postgres:
    image: postgres:17-alpine
    container_name: realm-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-realm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-realm}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: realm-seaweedfs
    restart: unless-stopped
    environment:
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-realm}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-realmsecret}
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-realm}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-realmsecret}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/seaweedfs
        if [ -f /config/s3.json ]; then
          cp /config/s3.json /etc/seaweedfs/s3.json
        else
          cat <<EOF > /etc/seaweedfs/s3.json
        {
          "identities": [
            {
              "name": "realm",
              "credentials": [
                {
                  "accessKey": "$$S3_ACCESS_KEY_ID",
                  "secretKey": "$$S3_SECRET_ACCESS_KEY"
                }
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        EOF
        fi
        exec weed server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.allowEmptyFolder=true -dir=/data
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweedfs_data:/data
      - ./config/seaweedfs/s3.json:/config/s3.json:ro
    networks:
      - caddy_net
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  caddy_net:
    external: true
  internal_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  seaweedfs_data:
    driver: local
